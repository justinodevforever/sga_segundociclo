{% load l10n %}<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Avaliação II Ciclo{% endblock %}</title>
<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#f5f6f8;color:#222}
 header{background:#1f3a5f;color:#fff;padding:12px 24px}
 header a{color:#fff;text-decoration:none;font-weight:600}
 main{max-width:1100px;margin:20px auto;padding:0 16px}
 table{border-collapse:collapse;width:100%;background:#fff}
 th,td{border:1px solid #d9dde3;padding:6px 8px;text-align:center}
 td.nome{text-align:left}
 th{background:#e8edf3}
 input[type=text],input[type=date],select{padding:5px;border:1px solid #bbb;border-radius:4px}
 td input[type=text]{width:64px;text-align:center}
 .btn{display:inline-block;background:#1f3a5f;color:#fff;border:0;padding:8px 16px;border-radius:5px;text-decoration:none;cursor:pointer}
 .btn.sec{background:#5b6b7f}
 .neg{color:#b00020;font-weight:700}
 .msg{padding:10px;border-radius:4px;margin:8px 0}
 .msg.success{background:#dff3e3}.msg.error{background:#fde1e4}
 .card{background:#fff;padding:14px;border-radius:6px;margin-bottom:12px}
 @media print{header,.noprint{display:none}}
</style>
</head>
<body>
<header><a href="{% url 'avaliacao:turmas' %}">Avaliação - II Ciclo</a></header>
<main>
{% for m in messages %}<div class="msg {{ m.tags }}">{{ m }}</div>{% endfor %}
{% block content %}{% endblock %}
</main>
</body></html>
