{% extends "portal/base.html" %}
{% block heading %}Alterar palavra-passe{% endblock %}
{% block content %}
<div class="card" style="max-width:480px"><form method="post">{% csrf_token %}
{% for f in form %}<div class="field"><label>{{ f.label }}</label>{{ f }}{{ f.errors }}</div>{% endfor %}
<button class="btn"><i class="bi bi-shield-lock"></i>Guardar palavra-passe</button></form></div>
<script>document.querySelectorAll("input").forEach(i=>i.classList.add("form-control"))</script>
{% endblock %}
